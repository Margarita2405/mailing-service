{% extends 'mailings/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h1>Клиенты</h1>
    <a href="{% url 'mailings:client_create' %}" class="btn btn-primary">Добавить клиента</a>
</div>
<table class="table table-striped mt-3">
    <thead><tr><th>Email</th><th>Ф.И.О.</th><th>Комментарий</th><th></th></tr></thead>
    <tbody>
    {% for client in clients %}
        <tr>
            <td>{{ client.email }}</td>
            <td>{{ client.full_name }}</td>
            <td>{{ client.comment|default:"—" }}</td>
            <td>
                <a href="{% url 'mailings:client_update' client.pk %}" class="btn btn-sm btn-outline-secondary">Изменить</a>
                <a href="{% url 'mailings:client_delete' client.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="4">Клиентов пока нет.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
