{% extends 'mailings/base.html' %}

{% block title %}Клиент: {{ client.full_name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Клиент</h1>
        <div>
            <a href="{% url 'mailings:client_update' client.pk %}" class="btn btn-outline-primary">Редактировать</a>
            <a href="{% url 'mailings:client_delete' client.pk %}" class="btn btn-outline-danger">Удалить</a>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <p><strong>Email:</strong> {{ client.email }}</p>
            <p><strong>Ф.И.О.:</strong> {{ client.full_name }}</p>
            <p><strong>Комментарий:</strong> {{ client.comment|default:"—" }}</p>
        </div>
    </div>
    <a href="{% url 'mailings:client_list' %}" class="btn btn-secondary mt-3">Назад к списку</a>
</div>
{% endblock %}
