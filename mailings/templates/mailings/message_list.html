{% extends 'mailings/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h1>Сообщения</h1>
    <a href="{% url 'mailings:message_create' %}" class="btn btn-primary">Добавить сообщение</a>
</div>
<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>Тема письма</th>
            <th>Тело письма</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
    {% for message in messages %}
        <tr>
            <td>{{ message.title }}</td>
            <td>{{ message.body|truncatechars:100 }}</td>  <!-- можно обрезать длинный текст -->
            <td>
                <a href="{% url 'mailings:message_update' message.pk %}" class="btn btn-sm btn-outline-secondary">Изменить</a>
                <a href="{% url 'mailings:message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3">Сообщений пока нет.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
