{% extends 'mailings/base.html' %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
<div class="container">
    <h1>Удаление рассылки</h1>
    <p>Вы уверены, что хотите удалить рассылку <strong>#{{ mailing.pk }} ({{ mailing.message.title }})</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailings:mailing_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
