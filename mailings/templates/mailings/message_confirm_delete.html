{% extends 'mailings/base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<div class="container">
    <h1>Удаление сообщения</h1>
    <p>Вы уверены, что хотите удалить сообщение <strong>{{ message.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
