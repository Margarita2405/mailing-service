{% extends 'mailings/base.html' %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
<div class="container">
    <h1>Удаление клиента</h1>
    <p>Вы уверены, что хотите удалить клиента <strong>{{ client.full_name }}</strong> ({{ client.email }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailings:client_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
