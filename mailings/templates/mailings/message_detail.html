{% extends 'mailings/base.html' %}

{% block title %}Сообщение: {{ message.title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Сообщение</h1>
        <div>
            <a href="{% url 'mailings:message_update' message.pk %}" class="btn btn-outline-primary">Редактировать</a>
            <a href="{% url 'mailings:message_delete' message.pk %}" class="btn btn-outline-danger">Удалить</a>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <p><strong>Тема:</strong> {{ message.title }}</p>
            <p><strong>Тело письма:</strong></p>
            <div class="border p-3 bg-light">{{ message.body|linebreaks }}</div>
        </div>
    </div>
    <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary mt-3">Назад к списку</a>
</div>
{% endblock %}
