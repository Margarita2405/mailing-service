{% extends 'mailings/base.html' %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="container">
    <h2>Установка нового пароля</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
